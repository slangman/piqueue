<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.page_title} + ' - piQueue'">Admin page - piQueue</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/custom-styles.css}" rel="stylesheet"/>
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-8">
            <h1 class="text-left mt-5"><a href="/" class="unstyled-link">piQueue</a></h1>
            <p class="lead text-left" th:text="#{admin.page_title}">Admin page</p>
        </div>
        <div th:replace="page-header :: copy"></div>
    </div>


    <div class="row">
        <div class="p-2">
            <h4 th:text="#{admin.operators_table_title}">Operators</h4>
        </div>
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{admin.operators_table_name_col}">Name</th>
                <th th:text="#{admin.operators_table_display_name_col}">Display Name</th>
                <th style="width: 10%" class="text-end" th:text="#{admin.operators_table_actions_col}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>
                <td th:text="${user.displayName}"></td>
                <td>
                    <div class="text-end">
                        <div class="d-inline-block">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/edit-user?id={id}(id=${user.id})}">
                                <!--replace with something shorter-->
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                     class="bi bi-pencil" viewBox="0 0 16 16">
                                    <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
                                </svg>
                            </a>
                        </div>
                        <div class="d-inline-block">
                            <!-- Delete form -->
                            <!--th:onsubmit="return confirm('#{admin.delete_user_confirmation}');"-->
                            <form th:action="@{/admin/users/{id}(id=${user.id})}"
                                  onsubmit="return confirmDelete();"
                                  method="post">
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="btn btn-sm btn-outline-secondary">
                                    <!--Replace with something shorter-->
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                         class="bi bi-trash3" viewBox="0 0 16 16">
                                        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>

                </td>
            </tr>
            </tbody>
        </table>
        <div class="p-2">
            <a class="btn btn-primary" href="/admin/create-user" role="button" th:text="#{admin.add_operator_button}">Add
                operator</a>
        </div>
    </div>
    <div class="row">
        <form method="post" action="/admin/settings" th:object="${ttsSettings}">
            <div class="p-2">

                <h4 th:text="#{admin.voice_settings}">Language settings</h4>

                <p>Speech provider</p>
                <select class="form-select"
                        aria-lable="Select speech provider"
                        id="speech-provider"
                        name="speech-provider"
                        th:field="*{provider}"
                        onchange="updateLanguageOptions()">
                    <option th:each="provider : ${providerLanguages.keySet()}"
                            th:value="${provider}" th:text="${provider}"
                            th:selected="${ttsSettings.provider == provider}">
                    </option>
                </select>

                <p th:text="#{admin.announcement_language}">Announcement language</p>
                <select class="form-select"
                        aria-label="Announcement language"
                        id="announcement-language"
                        name="announcement-language"
                        th:field="*{language}">
                    <option th:each="lang : ${providerLanguages.get(ttsSettings.provider)}"
                            th:value="${lang.name}"
                            th:text="${lang.displayName}"
                            th:selected="${ttsSettings.language == lang.name}">
                    </option>
                </select>

                <p th:text="#{admin.announcement_voice}">Voice</p>
                <select class="form-select"
                        aria-label="Select voice"
                        id="select-voice"
                        name="select-voice"
                        th:field="*{voiceName}">
                    <option th:each="voice : ${voices}"
                            th:value="${voice}"
                            th:text="${voice}"
                            th:selected="${voice == ttsSettings.voiceName}"></option>
                </select>
            </div>
            <div class="wrap">
                <button class="btn btn-primary" type="submit" th:text="#{common.save}">Save</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    function confirmDelete() {
        return confirm(/*[[#{admin.delete_user_confirmation}]]*/ 'Are you sure you want to delete this user?');
    }
    /*]]>*/
</script>

<script th:inline="javascript">
    const providerLanguages = /*[[${providerLanguages}]]*/ {};
    function updateLanguageOptions() {
        const providerSelect = document.getElementById('speech-provider');
        const languageSelect = document.getElementById('announcement-language');

        const selectedProvider = providerSelect.value;

        languageSelect.innerHTML = '';

        const languages = providerLanguages[selectedProvider] || [];

        languages.forEach(language => {
            const option = document.createElement('option');
            option.value = language.name;
            option.text = language.displayName;
            languageSelect.appendChild(option);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateLanguageOptions();
    });
</script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const providerSelect = document.getElementById("speech-provider");
        const languageSelect = document.getElementById("announcement-language");
        const voiceSelect = document.getElementById("select-voice");

        // Function to fetch voices
        async function fetchVoices(provider, language) {
            try {
                const response = await fetch(`/admin/voices?provider=${provider}&language=${language}`);
                if (response.ok) {
                    return await response.json();
                } else {
                    console.error("Failed to fetch voices");
                    return [];
                }
            } catch (error) {
                console.error("Error fetching voices:", error);
                return [];
            }
        }

        // Update voices dynamically
        async function updateVoices() {
            const provider = providerSelect.value;
            const language = languageSelect.value;

            if (provider && language) {
                const voices = await fetchVoices(provider, language);

                // Clear the voice dropdown
                voiceSelect.innerHTML = `<option value="" disabled selected>Select a voice</option>`;

                // Populate with new voices
                voices.forEach(voice => {
                    const option = document.createElement("option");
                    option.value = voice;
                    option.textContent = voice;
                    voiceSelect.appendChild(option);
                });
            }
        }

        // Attach event listeners
        providerSelect.addEventListener("change", updateVoices);
        languageSelect.addEventListener("change", updateVoices);
    });
</script>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
