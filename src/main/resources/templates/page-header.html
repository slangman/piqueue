<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="copy" class="col-4 d-flex justify-content-end align-items-center">
    <div class="d-inline block">
        <div class="dropdown bd-mode-toggle">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false" id="languageDropdown">
                <label th:text="#{common.current_language}"></label>
            </button>
            <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                <li><a class="dropdown-item" href="?lang=kz">Қазақ <img th:src="@{/images/lang_kz.png}"
                                                                        width="24" height="24"></a></li>
                <li><a class="dropdown-item" href="?lang=ru">Русский <img th:src="@{/images/lang_ru.png}"
                                                                          width="24" height="24"></a></li>
                <li><a class="dropdown-item" href="?lang=en">English <img th:src="@{/images/lang_en.png}"
                                                                          width="24" height="24"></a></li>
            </ul>
        </div>
    </div>
    <div class="d-inline-block p-1">
        <a class="btn btn-sm btn-outline-secondary"
           href="/profile">
            <!--Replace with something shorter-->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                 class="bi bi-person" viewBox="0 0 16 16">
                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
        </a>
    </div>
    <div class="d-inline-block">
        <a class="btn btn-sm btn-outline-secondary" href="/logout" th:text="#{common.logout}">Log out</a>
    </div>
</div>
</body>
</html>
